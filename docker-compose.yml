services:
  iris-data-init:
    image: intersystemsdc/irishealth-ml-community:2026.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /durable && chown -R 51773:51773 /durable"]
    restart: "no"
    volumes:
      - noshow-data:/durable

  iris:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: noshow-iris:2026.1-chat
    container_name: noshow-iris
    networks: [default, htc21-net]
    mem_limit: 4g
    restart: unless-stopped
    depends_on:
      iris-data-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${IRIS_WEB_PORT:-52773}:52773"
      - "127.0.0.1:${IRIS_SUPERSERVER_PORT:-1972}:1972"
    environment:
      IRIS_PASSWORD: ${IRIS_PASSWORD:?definir en .env.docker}
      ISC_DATA_DIRECTORY: /durable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      IRIS_BASE_URL: http://localhost:52773/csp/mltest
      IRIS_TOKEN: ${IRIS_TOKEN:-}
    volumes:
      - noshow-data:/durable
      - ${WORKSPACE_DIR:-.}/src:/iris/code:ro
      - ${WORKSPACE_DIR:-.}/iris105-chat:/iris/iris105-chat:ro
      - ${WORKSPACE_DIR:-.}/docker/iris.init:/usr/irissys/iris.init:ro
volumes:
  noshow-data:
networks:
  htc21-net:
    external: true
