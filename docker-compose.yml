services:
  iris:
    image: ${IRIS_IMAGE:-intersystemsdc/irishealth-ml-community:2026.1}
    container_name: noshow-iris
    networks: [default, htc21-net]
    mem_limit: 4g
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IRIS_WEB_PORT:-52773}:52773"
      - "127.0.0.1:${IRIS_SUPERSERVER_PORT:-1972}:1972"
    environment:
      IRIS_PASSWORD: ${IRIS_PASSWORD:?definir en .env.docker}
      ISC_DATA_DIRECTORY: /durable
    volumes:
      - noshow-data:/durable
      - ${WORKSPACE_DIR:-.}/src:/iris/code:ro
      - ${WORKSPACE_DIR:-.}/iris105-chat:/iris/iris105-chat:ro
      - ${WORKSPACE_DIR:-.}/docker/iris.init:/usr/irissys/iris.init:ro
volumes:
  noshow-data:
networks:
  htc21-net:
    external: true
